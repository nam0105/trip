<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeju Family Trip V3</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0}.header{background:#0ea5e9;color:#fff;padding:20px;text-align:center}.card{background:#fff;margin:12px;padding:16px;border-radius:12px}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea{width:100%;padding:8px;margin:4px 0}button{background:#0ea5e9;color:#fff;border:0;padding:8px 12px;border-radius:8px}#map{height:350px}.item{border-bottom:1px solid #eee;padding:8px}</style></head><body><div class="header"><h1>🏝 제주 가족여행 플래너 V3</h1><p>Firebase 실시간 동기화</p></div><div class="card"><h2>일정 추가</h2><input id="time" placeholder="09:30"><input id="title" placeholder="일정"><textarea id="memo" placeholder="메모"></textarea><button id="addBtn">추가</button><div id="list"></div></div><div class="card"><h2>가족 메모</h2><textarea id="familyMemo"></textarea><button id="saveMemo">저장</button></div><div class="card"><h2>예산</h2><input id="budget" type="number" placeholder="총 예산"><input id="spent" type="number" placeholder="사용 금액"><button id="saveBudget">저장</button><div id="remain"></div></div><div class="card"><h2>지도</h2><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,setDoc} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyDz3WFoqAGiRr9uN6PLrwU6a5tphA-cywY',authDomain:'jeju-family-trip-35d9c.firebaseapp.com',projectId:'jeju-family-trip-35d9c',storageBucket:'jeju-family-trip-35d9c.firebasestorage.app',messagingSenderId:'195998414148',appId:'1:195998414148:web:c05765eef2270eb8cd1311',measurementId:'G-TZ9QK72D58'};const app=initializeApp(firebaseConfig);const db=getFirestore(app);const ref=collection(db,'schedules');const list=document.getElementById('list');document.getElementById('addBtn').onclick=async()=>{await addDoc(ref,{time:time.value,title:title.value,memo:memo.value})};onSnapshot(ref,s=>{list.innerHTML='';s.forEach(d=>{const v=d.data();list.innerHTML+=`<div class=item><b>${v.time}</b> ${v.title}<br>${v.memo}<button onclick="window.delItem('${d.id}')">삭제</button></div>`})});window.delItem=async(id)=>{await deleteDoc(doc(db,'schedules',id))};const memoRef=doc(db,'settings','memo');saveMemo.onclick=()=>setDoc(memoRef,{text:familyMemo.value});onSnapshot(memoRef,s=>{if(s.exists())familyMemo.value=s.data().text||''});const budgetRef=doc(db,'settings','budget');saveBudget.onclick=()=>setDoc(budgetRef,{budget:+budget.value,spent:+spent.value});onSnapshot(budgetRef,s=>{if(s.exists()){const d=s.data();budget.value=d.budget;spent.value=d.spent;remain.innerText='남은 예산: '+((d.budget||0)-(d.spent||0)).toLocaleString()+'원';}});const map=L.map('map').setView([33.47,126.82],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);[['비자림',33.491,126.809],['4.3평화공원',33.448,126.651],['국립제주박물관',33.513,126.548],['아쿠아플라넷',33.433,126.927]].forEach(p=>L.marker([p[1],p[2]]).addTo(map).bindPopup(p[0]));</script></body></html>
