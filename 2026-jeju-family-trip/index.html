<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDz3WFoqAGiRr9uN6PLrwU6a5tphA-cywY",
 authDomain: "jeju-family-trip-35d9c.firebaseapp.com",
 projectId: "jeju-family-trip-35d9c",
 storageBucket: "jeju-family-trip-35d9c.firebasestorage.app",
 messagingSenderId: "195998414148",
 appId: "1:195998414148:web:c05765eef2270eb8cd1311",
 measurementId: "G-TZ9QK72D58"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.addDoc = addDoc;
window.collection = collection;
window.deleteDoc = deleteDoc;
window.doc = doc;
window.onSnapshot = onSnapshot;
window.setDoc = setDoc;
window.getDoc = getDoc;

</script>

<div class="card">
 
<h2>
📅 가족 공동 일정
</h2>
 
<input id="scheduleTime"
placeholder="09:30">
 
<br><br>
 
<input id="scheduleTitle"
placeholder="김녕미로공원">
 
<br><br>
 
<textarea
id="scheduleMemo"
placeholder="메모">
</textarea>
 
<br><br>
 
<button id="addScheduleBtn">
일정 추가
</button>
 
<ul id="scheduleList"></ul>
 
</div>

<div class="card">

<h2>
📝 가족 메모장
</h2>

<textarea
id="familyMemo"
style="width:100%;height:150px;">
</textarea>

<br>

<button id="saveMemo">
메모 저장
</button>

</div>

<div class="card">

<h2>
💰 여행 예산
</h2>

<input
id="budget"
type="number"
placeholder="총 예산">

<input
id="spent"
type="number"
placeholder="사용금액">

<button id="saveBudget">
저장
</button>

<p id="remain"></p>

</div>

<script type="module">

const tripsRef =
collection(db,"schedules");

const list =
document.getElementById(
"scheduleList"
);

document
.getElementById(
"addScheduleBtn"
)
.addEventListener(
"click",
async()=>{

const time =
document.getElementById(
"scheduleTime"
).value;

const title =
document.getElementById(
"scheduleTitle"
).value;

const memo =
document.getElementById(
"scheduleMemo"
).value;

await addDoc(
tripsRef,
{
time,
title,
memo,
createdAt:Date.now()
}
);

}
);

onSnapshot(
tripsRef,
(snapshot)=>{

list.innerHTML="";

snapshot.forEach(docItem=>{

const item =
docItem.data();

list.innerHTML += `
<li>
<strong>${item.time}</strong>
${item.title}
<br>
${item.memo}
<button onclick="deleteSchedule('${docItem.id}')">
삭제
</button>
</li>
<br>
`;

});

}
);

window.deleteSchedule =
async(id)=>{

await deleteDoc(
doc(db,"schedules",id)
);

};

const memoRef =
doc(db,
"settings",
"familyMemo"
);

document
.getElementById("saveMemo")
.addEventListener(
"click",
async()=>{

await setDoc(
memoRef,
{
text:
document.getElementById(
"familyMemo"
).value
}
);

}
);

onSnapshot(
memoRef,
(snapshot)=>{

if(snapshot.exists()){

document.getElementById(
"familyMemo"
).value =
snapshot.data().text;

}

});

const budgetRef=
doc(db,
"settings",
"budget"
);

document
.getElementById(
"saveBudget"
)
.addEventListener(
"click",
async()=>{

const budget=
Number(
document.getElementById(
"budget"
).value
);

const spent=
Number(
document.getElementById(
"spent"
).value
);

await setDoc(
budgetRef,
{
budget,
spent
}
);

});

onSnapshot(
budgetRef,
(snapshot)=>{

if(snapshot.exists()){

const d=
snapshot.data();

document.getElementById(
"budget"
).value =
d.budget;

document.getElementById(
"spent"
).value =
d.spent;

document.getElementById(
"remain"
).innerText =
"남은 예산 : " +
(d.budget-d.spent)
.toLocaleString()
+"원";

}

});

</script>
